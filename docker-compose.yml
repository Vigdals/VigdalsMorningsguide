services:
  morningsguide:
    image: vigdals-morningsguide-web
    build:
      context: .
      dockerfile: Dockerfile.pi

    container_name: vigdals-morningsguide

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"

      Frost__ClientId: "${FROST_CLIENT_ID}"

      Shelly__BaseUrl: "${SHELLY_BASE_URL}"
      Shelly__DeviceId: "${SHELLY_DEVICE_ID}"
      Shelly__AuthKey: "${SHELLY_AUTH_KEY}"

    ports:
      - "8081:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s